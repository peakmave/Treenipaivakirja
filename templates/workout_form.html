{% extends "layout.html" %}
{% block content %}
    <h2>Uusi treeni</h2>
    <form method="post">
        <label>Päivämäärä
            <input type="date" name="date" required>
        </label>
        <label>Laji
            <input type="text" name="type" placeholder="esim. voimaharjoittelu, juoksu" required>
        </label>
        <label>Kesto (min)
            <input type="number" name="duration">
        </label>
        <label>Muistiinpanot
            <textarea name="notes"></textarea>
        </label>
        <button type="submit">Tallenna</button>
    </form>
{% endblock %}
