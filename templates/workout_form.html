{% extends "layout.html" %}
{% block content %}
    <h2>{% if workout %}Muokkaa treeniä{% else %}Uusi treeni{% endif %}</h2>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Päivämäärä
            <input type="date" name="date" value="{{ form.date or '' }}" required>
        </label>
        <label>Laji
            <input type="text" name="type" value="{{ form.type or '' }}" placeholder="esim. voimaharjoittelu, juoksu" required>
        </label>
        <label>Kesto (min)
            <input type="number" name="duration" value="{{ form.duration or '' }}">
        </label>
        <label>Muistiinpanot
            <textarea name="notes">{{ form.notes or '' }}</textarea>
        </label>
        <fieldset>
            <legend>Luokat</legend>
            {% for category in all_categories %}
                <label>
                    <input type="checkbox" name="categories" value="{{ category.id }}"
                        {% if category.id|string in selected %}checked{% endif %}>
                    {{ category.name }}
                </label>
            {% endfor %}
        </fieldset>
        <button type="submit">Tallenna</button>
    </form>
{% endblock %}
