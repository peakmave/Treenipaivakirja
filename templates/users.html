{% extends "layout.html" %}
{% from "macros.html" import avatar %}
{% block content %}
    <h2>Käyttäjät</h2>
    <ul>
        {% for user in users %}
            <li>
                <a class="user-link" href="{{ url_for('show_user', user_id=user.id) }}">
                    {{ avatar(user.username, "small") }}
                    @{{ user.username }}
                </a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
