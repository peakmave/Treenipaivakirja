{% macro chips(categories) %}
    {% if categories %}
        {% for name in categories.split(", ") %}
            <span class="chip">{{ name }}</span>
        {% endfor %}
    {% else %}
        -
    {% endif %}
{% endmacro %}

{% macro avatar(username, size="small") %}
    <span class="avatar avatar-{{ size }}">{{ username[0]|upper }}</span>
{% endmacro %}
